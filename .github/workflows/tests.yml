name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: Build declared runtime without confidential inputs
        run: docker build --pull -t ledger-orchestrator:ci .
      - name: Run unit and LibreOffice integration tests offline
        run: docker run --rm --network none --entrypoint python ledger-orchestrator:ci -m unittest discover -s tests -q
