[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "ledger-orchestrator"
version = "0.1.0"
description = "Local-first, auditable financial statement extraction and review"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Anas Bougrine"}]
dependencies = [
    "pdfplumber==0.11.7",
    "pypdfium2==5.13.0",
    "openpyxl==3.1.5",
    "Pillow==11.3.0",
    "fastapi==0.116.1",
    "uvicorn==0.35.0",
    "opencv-python-headless==4.11.0.86",
    "langgraph==1.2.12",
    "langgraph-checkpoint-sqlite==3.1.1",
]

[project.scripts]
ledger-orchestrator = "ledger_orchestrator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ledger_orchestrator = ["ui/*.html", "ui/*.js", "ui/*.css"]
