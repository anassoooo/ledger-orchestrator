services:
  engine:
    build: .
    image: ledger-orchestrator:local
    volumes:
      - ./data/sources/STAR:/data/sources/STAR:ro
      - ./data/templates/TAF_G1_G2_G3_G4.xlsx:/data/templates/TAF_G1_G2_G3_G4.xlsx:ro
      - ./outputs:/output
    environment:
      CMF_CONFIG: /app/config/star.json
      CMF_LLM_URL: http://ollama:11434
      CMF_LLM_MODEL: ${CMF_LLM_MODEL:-}
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [local]
    mem_limit: 6g
    cpus: 4
  gateway:
    image: ledger-orchestrator:local
    command: ["python", "-m", "ledger_orchestrator.api.gateway"]
    ports:
      - "127.0.0.1:8000:8080"
    networks: [local, ingress]
    depends_on:
      engine:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 256m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=3)"]
      interval: 15s
      timeout: 5s
  ollama:
    profiles: [llm]
    image: ollama/ollama:latest
    volumes:
      - ollama_models:/root/.ollama
    networks: [local, ingress]
    security_opt: [no-new-privileges:true]
    mem_limit: 8g
    cpus: 4
networks:
  local:
    internal: true
  ingress: {}

volumes:
  ollama_models: {}
